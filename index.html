<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#0A1622">
<meta name="description" content="Vecode — a simple, clean AI website builder that runs entirely in your browser. Describe a site, watch the agent write real HTML/CSS/JS with a live preview, and deploy to Netlify in two steps. Free tier included — no API key needed.">
<title>Vecode — AI website builder in your browser</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230A1622'/%3E%3Ctext x='16' y='22' font-family='Georgia,serif' font-size='17' fill='%2300A1FF' text-anchor='middle'%3EV%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app">

  <!-- ================= topbar ================= -->
  <header id="topbar">
    <div class="brand">
      <span class="brand-mark serif">V</span>
      <span class="brand-name serif">ecode</span>
      <span class="brand-sub">website builder</span>
    </div>
    <div class="topbar-center">
      <button class="project-name" id="projectName" type="button" title="Rename project">Untitled project</button>
    </div>
    <div class="topbar-actions">
      <button class="icon-btn" id="themeToggle" title="Switch theme (dark / light / system)" aria-label="Switch theme">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M13.5 9.5A6 6 0 0 1 6.5 2.5a6 6 0 1 0 7 7Z"/></svg>
      </button>
      <button class="btn btn-sm" id="modelPill" title="Change model provider"></button>
      <button class="btn btn-signal btn-sm" id="deployBtn" title="Deploy guide">Deploy ↗</button>
      <button class="icon-btn" id="settingsBtn" title="Models &amp; settings" aria-label="Models and settings">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="2.2"/><path d="M8 1.8v2M8 12.2v2M1.8 8h2M12.2 8h2M3.6 3.6l1.4 1.4M11 11l1.4 1.4M12.4 3.6 11 5M5 11l-1.4 1.4"/></svg>
      </button>
    </div>
  </header>

  <!-- ================= main ================= -->
  <div id="main">

    <!-- rail -->
    <nav id="rail" aria-label="Sections">
      <p class="rail-label">Workspace</p>
      <button class="rail-item active" data-view="build"><span class="rail-ico"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M8 1.5 9.7 6.3 14.5 8 9.7 9.7 8 14.5 6.3 9.7 1.5 8 6.3 6.3Z"/></svg></span>Build</button>
      <button class="rail-item" data-view="files"><span class="rail-ico"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M2.5 3.5h11v9h-11z"/><path d="M5.5 6.5h5M5.5 9h3.5"/></svg></span>Files</button>
      <button class="rail-item" data-view="plugins"><span class="rail-ico"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="m8 1.5 1.7 4.8 4.8 1.7-4.8 1.7L8 14.5 6.3 9.7 1.5 8l4.8-1.7Z"/><path d="M12.8 11.2l.7 1.3 1.3.7-1.3.7-.7 1.3-.7-1.3-1.3-.7 1.3-.7Z" opacity=".6"/></svg></span>Plugins</button>
      <button class="rail-item" data-view="skill"><span class="rail-ico"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 3h8v10l-2.5-2H4z"/><path d="M6.5 6.5h3M6.5 8.5h2.5"/></svg></span>Design skill</button>
      <button class="rail-item" data-view="deploy"><span class="rail-ico"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M8 1.5v8M4.5 6 8 9.5 11.5 6"/><path d="M2.5 10.5v3h11v-3"/></svg></span>Deploy</button>
      <div class="rail-foot">
        <div class="conn-card">
          <span class="conn-dot idle" id="connDot"></span><span id="connLabel">describe a site to begin</span>
        </div>
      </div>
    </nav>

    <!-- center column -->
    <section id="center">
      <div id="view-build" class="view active">
        <div id="chatScroll"><div id="chatLog"></div></div>
        <div id="statusBar">
          <span><span class="status-spin">●</span> <span id="statusAction">ready</span></span>
          <span id="statusTokens"></span>
        </div>
        <div id="composer">
          <div id="promptChips"></div>
          <div id="composerBox">
            <textarea id="chatInput" rows="1" placeholder="Describe the site you want — one sentence is plenty…"></textarea>
            <button class="btn btn-signal" id="sendBtn">Build</button>
            <button class="btn" id="stopBtn" style="display:none">Stop</button>
          </div>
          <div id="composerHint">
            <span>files autosave · preview updates live</span>
            <button class="text-btn" id="clearChatBtn" type="button">Clear chat</button>
            <span><span class="kbd">Enter</span> to build · <span class="kbd">Shift</span> + <span class="kbd">Enter</span> for a new line</span>
          </div>
        </div>
      </div>
      <div id="view-files" class="view"></div>
      <div id="view-plugins" class="view"></div>
      <div id="view-skill" class="view"></div>
      <div id="view-deploy" class="view"></div>
    </section>

    <!-- preview -->
    <section id="previewPane" aria-label="Live preview">
      <div class="preview-toolbar">
        <div class="device-seg" id="deviceSeg" role="group" aria-label="Preview device size"></div>
        <span class="preview-url mono" id="previewUrl">preview://index.html</span>
        <button class="icon-btn" id="refreshPreview" title="Refresh preview" aria-label="Refresh preview">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9M13.5 1.8v2.6h-2.6"/></svg>
        </button>
        <button class="icon-btn" id="openPreview" title="Open in new tab" aria-label="Open preview in new tab">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M6.5 2.5h-3a1 1 0 0 0-1 1v9a1 1 0 0 0 1 1h9a1 1 0 0 0 1-1v-3"/><path d="M9 2.5h4.5V7"/><path d="M13.5 2.5 8 8"/></svg>
        </button>
        <button class="err-badge" id="errBadge" title="Preview console errors"></button>
      </div>
      <div id="previewStage">
        <iframe id="previewFrame" title="Live preview of your site" data-device="desktop" sandbox="allow-scripts allow-forms allow-popups allow-modals allow-downloads allow-pointer-lock"></iframe>
      </div>
    </section>
  </div>
</div>

<div id="modalRoot"></div>
<div id="toastRoot"></div>

<!-- scripts (plain, dependency-free, work from file:// too) -->
<script src="skill/assets/decoding-texture.js"></script>
<script src="js/state.js"></script>
<script src="js/zip.js"></script>
<script src="js/providers.js"></script>
<script src="js/plugins.js"></script>
<script src="js/templates.js"></script>
<script src="js/skill.js"></script>
<script src="js/agent.js"></script>
<script src="js/app.js"></script>
</body>
</html>
