# Vecode v3 — Netlify configuration (rebuilt ground-up)
# This file ships in every project export and also deploys Vecode itself.
# Vecode is a static site: no build step, nothing to compile.

[build]
  publish = "."

# Security headers + no-sniffing for generated sites.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    X-XSS-Protection = "1; mode=block"

# SPA-style fallback: if your site grows client-side routes, uncomment this.
# [[redirects]]
#   from = "/*"
#   to = "/index.html"
#   status = 200
